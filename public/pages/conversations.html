<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversations</title><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/layout.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/forms.css"><link rel="stylesheet" href="/static/css/tables.css"><link rel="stylesheet" href="/static/css/conversations.css"><link rel="stylesheet" href="/static/css/responsive.css"></head><body data-page="conversations"><section id="page-content"><div class="page-head"><div><div class="kpi-label">OPERATIONS / LIVECHAT</div><h1>Conversations</h1><p class="muted">Inbox aktif LiveChat dengan state AI/Human yang konsisten.</p></div><div class="toolbar"><span id="inboxCount" class="badge">0 chats</span><button class="btn ghost" id="refreshChats">Refresh</button></div></div><div class="conversation-layout"><aside class="inbox"><div class="inbox-tools"><input id="chatSearch" placeholder="Cari nama / chat / pesan..."><div class="toolbar"><button class="mini-filter active" data-filter="ALL">Semua</button><button class="mini-filter" data-filter="NEEDS_REPLY">Belum dibalas</button><button class="mini-filter" data-filter="HUMAN">Human</button></div></div><div id="chatList"></div></aside><section class="conversation-pane"><header class="conversation-head"><div><div class="kpi-label" id="chatSession">NO CONVERSATION</div><b id="chatName">Pilih conversation</b> <span id="mode" class="badge">-</span></div><div class="toolbar"><button class="btn ghost" id="takeoverBtn">Take Over</button><button class="btn ghost" id="returnAiBtn">Return to AI</button><button class="btn danger" id="endBtn">END CHAT</button></div></header><div class="messages" id="messages"><div class="empty">Pilih percakapan dari inbox.</div></div><div id="imagePreview" class="image-preview hidden"></div><div class="composer"><div id="shortcutMenu" class="shortcut-menu hidden"></div><div class="composer-actions"><label class="attach-btn" title="Upload image">＋<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label></div><textarea id="composerText" placeholder="Take Over untuk membalas. Ketik # untuk canned response. Enter kirim, Shift+Enter baris baru." disabled></textarea><button class="btn" id="sendBtn">Kirim</button></div></section><aside class="customer-panel"><div class="section-title"><h3>Customer</h3><span id="customerStatus" class="badge">-</span></div><div id="customerInfo" class="customer-info"><div class="empty">Pilih percakapan.</div></div><div class="section-title case-title"><h3>Workflow</h3></div><div id="workflowInfo"></div></aside></div></section><script type="module">import{mountShell}from'/static/js/core/shell.js';await mountShell();await import('/static/js/pages/conversations.js');</script></body></html>
